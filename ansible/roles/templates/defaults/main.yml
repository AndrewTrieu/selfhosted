---
# Config templates copied once from homelab/services/ into /tank/services/ (README step 4.2).
# force: false means a copy never overwrites a file on the server. Server files hold real
# secrets and runtime state (the AdGuard login hash, the HA .storage/http trust settings).
homelab_template_dirs:
  - "{{ homelab_data_root }}/adguard/conf"
  - "{{ homelab_data_root }}/caddy"
  - "{{ homelab_data_root }}/crowdsec/acquis.d"
  - "{{ homelab_data_root }}/filebrowser/data"
  - "{{ homelab_data_root }}/homeassistant/config/.storage"
  - "{{ homelab_data_root }}/unbound/custom.conf.d"
  - "{{ homelab_data_root }}/unbound"
  - "{{ homelab_data_root }}/site"

homelab_template_files:
  - { src: adguard/conf/AdGuardHome.yaml, dest: "{{ homelab_data_root }}/adguard/conf/AdGuardHome.yaml" }
  - { src: caddy/Dockerfile, dest: "{{ homelab_data_root }}/caddy/Dockerfile" }
  - { src: crowdsec/acquis.d/caddy.yaml, dest: "{{ homelab_data_root }}/crowdsec/acquis.d/caddy.yaml" }
  - { src: filebrowser/data/config.yaml, dest: "{{ homelab_data_root }}/filebrowser/data/config.yaml" }
  - { src: homeassistant/config/.storage/http, dest: "{{ homelab_data_root }}/homeassistant/config/.storage/http" }
  - { src: unbound/custom.conf.d/cachedb.conf, dest: "{{ homelab_data_root }}/unbound/custom.conf.d/cachedb.conf" }
  - { src: unbound/root.hints, dest: "{{ homelab_data_root }}/unbound/root.hints" }

# Per-stack config, keyed by the stack name used in homelab_stacks.
homelab_stack_template_dirs:
  auth: []
  ci:
    - "{{ homelab_data_root }}/forgejo/runner/data"
  monitoring: []
  matter: []
homelab_stack_template_files:
  auth: []
  ci:
    - { src: forgejo/runner/data/config.yaml, dest: "{{ homelab_data_root }}/forgejo/runner/data/config.yaml" }
  monitoring: []
  matter: []

adguard_config_path: "{{ homelab_data_root }}/adguard/conf/AdGuardHome.yaml"
