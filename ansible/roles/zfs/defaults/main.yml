---
zfs_pool_name: tank
zfs_packages:
  - zfsutils-linux
  - zfs-auto-snapshot

# Base datasets from README "Create one dataset per stateful service". Parents are created with -p.
zfs_datasets:
  - 2fauth
  - 3x-ui
  - adguard
  - airtrail
  - airtrail/postgres
  - caddy
  - crowdsec
  - dozzle
  - filebrowser
  - filebrowser/srv
  - forgejo
  - forgejo/postgres
  - homeassistant
  - matter-hub
  - portainer
  - unbound
  - unbound/redis
  - vaultwarden
  - wg-easy

# Per-stack datasets, keyed by the name used in homelab_stacks and COMPOSE_PROFILES.
zfs_stack_datasets:
  auth:
    - authentik
    - authentik/postgres
    - authentik/redis
    - authentik/media
    - authentik/custom-templates
    - authentik/certs
  ci:
    - forgejo/runner
  monitoring:
    - uptimekuma
    - netdata
  matter:
    - matter-server
    - otbr

# Database datasets need recordsize=16K (README step 4).
zfs_recordsize_16k:
  - forgejo/postgres
  - airtrail/postgres
  - unbound/redis
zfs_stack_recordsize_16k:
  auth:
    - authentik/postgres
    - authentik/redis
  ci: []
  monitoring: []
  matter: []
