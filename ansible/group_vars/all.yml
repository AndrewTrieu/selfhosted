---
# Non-secret settings shared by every play. Secrets go in ansible-vault, never here.

# Login user that owns the homelab crontab entries (the README uses the server login user).
homelab_user: "{{ ansible_user }}"

# Repo root, resolved from this playbook directory (ansible/ sits next to homelab/).
homelab_repo_root: "{{ playbook_dir }}/.."

# Where persistent service data lives. With ZFS, this must be /<pool>/services (see zfs_pool_name).
homelab_data_root: /tank/services

# Use ZFS datasets for the data root. Set false to create plain folders instead.
homelab_use_zfs: true

# Stacks to prepare: any of auth, ci, monitoring, matter. Must match COMPOSE_PROFILES in .env,
# which is what actually starts them. Empty means the core stacks only.
homelab_stacks: []

# LAN interface name. Must match stacks/matter.yml and stacks/home.yml.
homelab_lan_interface: enp5s0

# Pool layout for the zfs_pool role: two mirrors of four disks. Use stable /dev/disk/by-id paths.
# Placeholders fail the assert in roles/zfs_pool.
zfs_pool_disks:
  - /dev/disk/by-id/REPLACE_DISK_A
  - /dev/disk/by-id/REPLACE_DISK_B
  - /dev/disk/by-id/REPLACE_DISK_C
  - /dev/disk/by-id/REPLACE_DISK_D
