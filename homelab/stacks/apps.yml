services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://${VAULT_DOMAIN}"
    volumes:
      - /tank/services/vaultwarden:/data
    networks:
      - proxy

  2fauth:
    image: 2fauth/2fauth:latest
    container_name: 2fauth
    restart: always
    volumes:
      - /tank/services/2fauth:/2fauth
    environment:
      APP_NAME: 2FAuth
      APP_ENV: production
      APP_DEBUG: false
      APP_TIMEZONE: Europe/Helsinki
      SITE_OWNER: ${EMAIL}      
      APP_KEY:  ${TWOFAUTH_APP_KEY}
      APP_URL: "https://${TWOFAUTH_DOMAIN}"
      ASSET_URL: "https://${TWOFAUTH_DOMAIN}"
      TRUSTED_PROXIES: '*'
      LOG_CHANNEL: daily
      LOG_LEVEL: notice
    networks:
      - proxy

  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    restart: always
    volumes:
      - /tank/services/filebrowser/srv:/srv
      - /tank/services/filebrowser/data:/home/filebrowser/data
    user: "1000:1000"
    networks:
      - proxy

  forgejo-db:
    image: postgres:15
    container_name: forgejo-db
    restart: always
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      POSTGRES_DB: forgejo
    volumes:
      - /tank/services/forgejo/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: always
    depends_on:
      - forgejo-db
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__SSH_PORT: 22
      FORGEJO__server__SSH_LISTEN_PORT: 22
      FORGEJO__server__LFS_START_SERVER: true
      # Settings otherwise only chosen in the install wizard (written into app.ini on start)
      FORGEJO__DEFAULT__APP_NAME: "Andrew's Code Forge"
      FORGEJO__server__DOMAIN: ${GIT_DOMAIN}
      FORGEJO__server__SSH_DOMAIN: ${GIT_DOMAIN}
      FORGEJO__server__ROOT_URL: "https://${GIT_DOMAIN}/"
      FORGEJO__server__OFFLINE_MODE: true
      FORGEJO__security__REVERSE_PROXY_LIMIT: 1
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "*"
      FORGEJO__service__DISABLE_REGISTRATION: true
    volumes:
      - /tank/services/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  airtrail-db:
    image: postgres:15
    container_name: airtrail-db
    restart: always
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
    volumes:
      - /tank/services/airtrail/postgres:/var/lib/postgresql/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airtrail -d airtrail"]
      interval: 5s
      timeout: 5s
      retries: 5

  airtrail:
    container_name: airtrail
    image: johly/airtrail:latest
    restart: always
    depends_on:
      airtrail-db:
        condition: service_healthy
    environment:
      ORIGIN: "https://${AIRTRAIL_DOMAIN}"
      DB_DATABASE_NAME: airtrail
      DB_USERNAME: airtrail
      DB_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
      DB_URL: "postgres://airtrail:${AIRTRAIL_DB_PASSWORD}@airtrail-db:5432/airtrail"
      UPLOAD_LOCATION: /app/uploads
      BODY_SIZE_LIMIT: 20M
      INTEGRATIONS_AERO_DATA_BOX_KEY: ${AIRTRAIL_AERO_DATA_BOX_KEY}
      INTEGRATIONS_OPEN_AIP_KEY: ${AIRTRAIL_OPEN_AIP_KEY}
    volumes:
      - /tank/services/airtrail:/app/uploads
    networks:
      - proxy

