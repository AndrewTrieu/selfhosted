# Profile: ci. Turn on by adding "ci" to COMPOSE_PROFILES in .env.
# This runs the CI runner on this machine. Do not run it on the server that hosts
# your other services: CI jobs get powerful access to the machine they run on.
# Run the runner on a separate VM instead. See "Setting up the CI runner" in the README.
services:
  docker-in-docker:
    profiles: ["ci"]
    image: docker:dind
    container_name: docker_dind
    privileged: true
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    restart: always

  forgejo-runner:
    profiles: ["ci"]
    image: data.forgejo.org/forgejo/runner:12
    container_name: runner
    depends_on:
      docker-in-docker:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    user: 1001:1001
    volumes:
      - ${HOMELAB_DATA:-/tank/services}/forgejo/runner/data:/data
    restart: always
    command: forgejo-runner daemon --config config.yaml
