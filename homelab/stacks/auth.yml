# Profile: auth. Starts only when "auth" is listed in COMPOSE_PROFILES in .env.
# Also requires: AUTH_DOMAIN + AUTHENTIK_* in .env, AUTH_DOMAIN passed to caddy
# in stacks/edge.yml, the Authentik site block in the Caddyfile, "auth" in
# cloudflare_ddns.sh, and the authentik ZFS datasets (see README).
services:
  authentik-db:
    profiles: ["auth"]
    image: postgres:16-alpine
    container_name: authentik-db
    restart: always
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - ${HOMELAB_DATA:-/tank/services}/authentik/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  authentik-redis:
    profiles: ["auth"]
    image: redis:latest
    container_name: authentik-redis
    restart: always
    volumes:
      - ${HOMELAB_DATA:-/tank/services}/authentik/redis:/data
    networks:
      - proxy

  authentik-server:
    profiles: ["auth"]
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: always
    command: server
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
      AUTHENTIK_COOKIE__SECURE: true
    volumes:
      - ${HOMELAB_DATA:-/tank/services}/authentik/media:/media
      - ${HOMELAB_DATA:-/tank/services}/authentik/custom-templates:/templates
    networks:
      - proxy

  authentik-worker:
    profiles: ["auth"]
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: always
    command: worker
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOMELAB_DATA:-/tank/services}/authentik/media:/media
      - ${HOMELAB_DATA:-/tank/services}/authentik/certs:/certs
      - ${HOMELAB_DATA:-/tank/services}/authentik/custom-templates:/templates
    networks:
      - proxy
