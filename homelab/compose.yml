services:
  # ==========================
  # Vaultwarden (Password manager)
  # ==========================
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    volumes:
      - /tank/services/vaultwarden:/data
    environment:
      DOMAIN: "https://${VAULT_DOMAIN}"
    networks:
      - proxy

  # ==========================
  # 2FAuth (2FA manager)
  # ==========================
  2fauth:
    image: 2fauth/2fauth:latest
    container_name: 2fauth
    restart: always
    volumes:
      - /tank/services/2fauth:/data
    environment:
      APP_NAME: 2FAuth
      APP_ENV: production
      APP_DEBUG: false
      APP_TIMEZONE: UTC
      SITE_OWNER: ${EMAIL}      
      APP_KEY:  ${TWOFAUTH_APP_KEY}
      APP_URL: "https://${TWOFAUTH_DOMAIN}"
      ASSET_URL: "https://${TWOFAUTH_DOMAIN}"
      TRUSTED_PROXIES: '*'
      LOG_CHANNEL: daily
      LOG_LEVEL: notice
    networks:
      - proxy

  # ==========================
  # Filebrowser Quantum (Cloud file manager)
  # ==========================
  filebrowser:
    image: gtstef/filebrowser:stable
    container_name: filebrowser
    restart: always
    volumes:
      - /tank/services/filebrowser/srv:/srv
      - /tank/services/filebrowser/data:/home/filebrowser/data
    user: "1000:1000"
    networks:
      - proxy

  # ==========================
  # Airtrail (Flight tracking)
  # ==========================
  airtrail-db:
    image: postgres:15
    container_name: airtrail-db
    restart: always
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
    volumes:
      - /tank/services/airtrail/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  airtrail:
    container_name: airtrail
    image: johly/airtrail:latest
    restart: always
    depends_on:
      - airtrail-db
    environment:
      ORIGIN: "https://${FLIGHTS_DOMAIN}"
      DB_DATABASE_NAME: airtrail
      DB_USERNAME: airtrail
      DB_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
      DB_URL: "postgres://airtrail:${AIRTRAIL_DB_PASSWORD}@airtrail-db:5432/airtrail"
      UPLOAD_LOCATION: /app/uploads
      BODY_SIZE_LIMIT: 20M
      INTEGRATIONS_AERO_DATA_BOX_KEY: ${AIRTRAIL_AERO_DATA_BOX_KEY}
      INTEGRATIONS_OPEN_AIP_KEY: ${AIRTRAIL_OPEN_AIP_KEY}
    volumes:
      - /tank/services/airtrail:/app/uploads
    networks:
      - proxy

  # ==========================
  # Unbound DNS Resolver with Redis Cache
  # ==========================
  unbound-redis:
    image: redis:latest
    container_name: unbound-redis
    hostname: redis
    restart: unless-stopped
    volumes:
      - /tank/services/unbound/redis:/data
    networks:
      - vpndns

  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: always
    depends_on:
      - unbound-redis
    volumes:
    - /tank/services/unbound/custom.conf.d:/etc/unbound/custom.conf.d:ro
    - /tank/services/unbound/root.hints:/etc/unbound/root.hints:ro
    networks:
      vpndns:
        ipv4_address: 10.2.0.53

  # ==========================
  # AdGuard Home (DNS ad blocker)
  # ==========================
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: always
    depends_on:
      - unbound
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - /tank/services/adguard/work:/opt/adguardhome/work
      - /tank/services/adguard/conf:/opt/adguardhome/conf
    cap_add:
      - NET_ADMIN
    networks:
      proxy:
        ipv4_address: 172.30.0.100
      vpndns:
        ipv4_address: 10.2.0.100

  # ==========================
  # WG-Easy (WireGuard VPN)
  # ==========================
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: always
    depends_on:
      - adguard
    environment:
      WG_HOST: ${WG_DOMAIN}
      PASSWORD_HASH: ${WG_EASY_PASSWORD_HASH}
      WG_DEFAULT_DNS: adguard
    volumes:
      - /tank/services/wg-easy/data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks: 
      proxy:
        ipv4_address: 172.30.0.90
      vpndns:
        ipv4_address: 10.2.0.90

  # ==========================
  # 3X-UI
  # ==========================
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3xui_app
    volumes:
      - /tank/services/3x-ui/db:/etc/x-ui
      - /tank/services/3x-ui/cert:/root/cert
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    network_mode: host
    restart: always

  # ==========================
  # Forgejo with Postgres DB
  # ==========================
  forgejo-db:
    image: postgres:15
    container_name: forgejo-db
    restart: always
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      POSTGRES_DB: forgejo
    volumes:
      - /tank/services/forgejo/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: always
    depends_on:
      - forgejo-db
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__SSH_PORT: 22
      FORGEJO__server__SSH_LISTEN_PORT: 22
      FORGEJO__server__LFS_START_SERVER: true
    volumes:
      - /tank/services/forgejo/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy

  docker-in-docker:
    image: docker:dind
    container_name: 'docker_dind'
    privileged: 'true'
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    restart: 'always'

  forgejo-runner:
    image: 'data.forgejo.org/forgejo/runner:12'
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
    container_name: 'runner'
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    user: 1001:1001
    volumes:
      - /tank/services/forgejo/runner/data:/data
    restart: 'always'
    command: 'forgejo-runner daemon --config runner-config.yml'

  # ==========================
  # Authentik (Identity provider / SSO)
  # ==========================
  authentik-db:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: always
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - /tank/services/authentik/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  authentik-redis:
    image: redis:latest
    container_name: authentik-redis
    restart: always
    volumes:
      - /tank/services/authentik/redis:/data
    networks:
      - proxy

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: always
    command: server
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
      AUTHENTIK_COOKIE__SECURE: true
    volumes:
      - /tank/services/authentik/media:/media
      - /tank/services/authentik/custom-templates:/templates
    networks:
      - proxy

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: always
    command: worker
    depends_on:
      - authentik-db
      - authentik-redis
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: false
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tank/services/authentik/media:/media
      - /tank/services/authentik/certs:/certs
      - /tank/services/authentik/custom-templates:/templates
    networks:
      - proxy

  # ==========================
  # Caddy (Reverse proxy)
  # ==========================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy
    restart: always
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/homelab/Caddyfile:/etc/caddy/Caddyfile:ro
      - /tank/services/caddy/config:/config
      - /tank/services/caddy/data:/data
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      VAULT_DOMAIN: ${VAULT_DOMAIN}
      TWOFAUTH_DOMAIN: ${TWOFAUTH_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN}
      WG_DOMAIN: ${WG_DOMAIN}
      GIT_DOMAIN: ${GIT_DOMAIN}
      DNS_DOMAIN: ${DNS_DOMAIN}
      XUI_DOMAIN: ${XUI_DOMAIN}
      REALITY_DOMAIN: ${REALITY_DOMAIN}
      FLIGHTS_DOMAIN: ${FLIGHTS_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
      CROWDSEC_API_KEY: ${CROWDSEC_API_KEY}
      EMAIL: ${EMAIL}
      LOG_FILE: /data/access.log
    networks:
      - proxy

  # ==========================
  # CrowdSec (Security agent)
  # ==========================
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: always
    depends_on:
      - caddy
    environment:
      COLLECTIONS: >
        crowdsecurity/caddy
        crowdsecurity/linux
        crowdsecurity/sshd
        crowdsecurity/http-cve
        crowdsecurity/base-http-scenarios
        crowdsecurity/whitelist-good-actors
        crowdsecurity/appsec-virtual-patching
      GID: "1000"
    volumes:
      - /tank/services/crowdsec/data:/var/lib/crowdsec/data
      - /tank/services/crowdsec/config:/etc/crowdsec
      - /tank/services/crowdsec/acquis.d:/etc/crowdsec/acquis.d
      - /tank/services/caddy/data:/var/log/caddy:ro
    networks:
      - proxy

  # ==========================
  # Cloudflared (Cloudflare Tunnel)
  # ==========================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - proxy

  # ==========================
  # Portainer (Docker manager)
  # ==========================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tank/services/portainer:/data

  # ==========================
  # Uptime Kuma (uptime monitor)
  # ==========================
  uptimekuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: always
    ports:
      - 3001:3001
    volumes:
      - /tank/services/uptimekuma:/app/data

  # ==========================
  # Dozzle (live logs viewer)
  # ==========================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    ports:
      - 9999:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ==========================
  # Netdata (system monitoring)
  # ==========================
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: always
    ports:
      - 19999:19999
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /tank/services/netdata/config:/etc/netdata
      - /tank/services/netdata/lib:/var/lib/netdata
      - /tank/services/netdata/cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  vpndns:
    ipam:
      config:
        - subnet: 10.2.0.0/24