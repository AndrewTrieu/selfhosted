# Root of the homelab stack. Services live in stacks/*.yml; networks are defined
# only here so every included file shares them. Run all commands from this dir.
include:
  - path: stacks/edge.yml      # caddy, crowdsec, cloudflared
    env_file: .env
  - path: stacks/dns-vpn.yml   # wg-easy, adguard, unbound, unbound-redis
    env_file: .env
  - path: stacks/apps.yml      # vaultwarden, 2fauth, filebrowser, forgejo, airtrail
    env_file: .env
  - path: stacks/admin.yml     # portainer, dozzle, 3xui
    env_file: .env
  - path: stacks/home.yml      # homeassistant, matter-hub
    env_file: .env
  # Optional stacks: each service has a profile, and COMPOSE_PROFILES in .env picks which start.
  - path: stacks/auth.yml       # authentik (profile: auth)
    env_file: .env
  - path: stacks/ci.yml         # forgejo-runner, docker-in-docker (profile: ci)
    env_file: .env
  - path: stacks/monitoring.yml # uptime-kuma, netdata (profile: monitoring)
    env_file: .env
  - path: stacks/matter.yml     # matter-server, otbr (profile: matter)
    env_file: .env

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  vpndns:
    ipam:
      config:
        - subnet: 10.2.0.0/24
